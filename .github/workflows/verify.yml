name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - feature/desktop-packaging
      - refactor

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Verify web and API without Rust or Tauri
        run: npm run verify

  # Independent of the rust-free lint/test job, 100-photo real-browser job,
  # and frozen sidecar /health.
  # Runs npm run test:e2e (Playwright mocked E2E + tests/e2e/real-local-smoke.spec.ts).
  # Does not run test:e2e:real-browser:large (500/1000/2000). Does not install
  # Rust, sign, or launch a packaged NSIS/DMG GUI.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked E2E and real-local-smoke
        run: npm run test:e2e

  # Independent of the rust-free lint/test job, mocked E2E, and frozen sidecar.
  # Runs npm run test:e2e:real-browser (100 generated JPEGs, Chromium).
  # Does not run test:e2e:real-browser:large (500/1000/2000). Does not install
  # Rust, sign, or launch a packaged NSIS/DMG GUI.
  e2e-real-browser:
    name: Playwright real-browser (100 photos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 100-photo real-browser smoke
        run: npm run test:e2e:real-browser

  # Independent of the rust-free lint/test job. Builds the PyInstaller sidecar
  # then runs scripts/sidecar-smoke.sh (npm run test:sidecar). Frozen smoke
  # unsets PYTHONPATH to match packaged Tauri spawn. Does not install Rust,
  # sign, or launch a GUI.
  sidecar-health:
    name: frozen sidecar /health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Build frozen sidecar
        run: npm run packaging:sidecar

      - name: Smoke frozen sidecar /health without PYTHONPATH
        run: npm run test:sidecar
