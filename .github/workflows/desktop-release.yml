# Leftover #200 — publish unsigned GitHub Release v2.1.3-desktop
# (Windows NSIS + macOS DMG) from a desktop.yml run that includes the
# #198 NSIS locked-file hooks (SHA d9d29e8e67fc9849f1878ba9f982b4211a94d76b+).
#
# Reuses installer artifacts from desktop.yml. Does not build, sign,
# notarize, staple, or launch packaged GUI. Do not download leftover
# GUI-evidence zips. Do not use tauri-action.
#
# Trigger:
#   - workflow_dispatch to publish from the latest qualifying desktop.yml
#     run, or from an explicit run id.
#   - workflow_run when desktop.yml completes on main (so a just-built
#     installer set can publish without a second click).
#   - push to main when this workflow or the unsigned release notes change.
#
# A qualifying run must include the #198 SHA and both installer artifacts.
# Leftover GUI steps run after the uploads, so a red quit+job / 500 job is
# allowed when FramePilot-windows-nsis and FramePilot-macos-dmg are present.
# Do not republish pre-#198 v2.1.2-desktop packages.

name: desktop-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the unsigned desktop GitHub Release
        type: string
        default: v2.1.3-desktop
      desktop_run_id:
        description: desktop.yml run id (empty = latest qualifying main run)
        type: string
        default: ""
  workflow_run:
    workflows: ["desktop"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-release.yml"
      - "docs/desktop_unsigned_release_notes.md"

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish-unsigned-release:
    name: Publish unsigned NSIS + DMG
    if: >
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
      || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve desktop.yml run with #198 NSIS locked-file hooks
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.inputs.desktop_run_id || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          MIN_SHA: d9d29e8e67fc9849f1878ba9f982b4211a94d76b
        run: |
          set -euo pipefail

          sha_includes_locked_upgrade_hooks() {
            local head_sha="$1"
            local status
            status="$(
              gh api "repos/${GITHUB_REPOSITORY}/compare/${MIN_SHA}...${head_sha}" \
                --jq .status
            )"
            case "${status}" in
              identical|ahead) return 0 ;;
              *) return 1 ;;
            esac
          }

          run_has_installer_artifacts() {
            local run_id="$1"
            local names
            names="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | .name'
            )"
            grep -qx 'FramePilot-windows-nsis' <<<"${names}" \
              && grep -qx 'FramePilot-macos-dmg' <<<"${names}"
          }

          pick_qualifying_run() {
            local only_success="$1"
            local id sha conclusion status
            while IFS=$'\t' read -r id sha conclusion status; do
              [[ "${status}" == "completed" ]] || continue
              if [[ "${only_success}" == "1" ]]; then
                [[ "${conclusion}" == "success" ]] || continue
              else
                [[ "${conclusion}" == "success" || "${conclusion}" == "failure" ]] || continue
              fi
              sha_includes_locked_upgrade_hooks "${sha}" || continue
              run_has_installer_artifacts "${id}" || continue
              printf '%s' "${id}"
              return 0
            done <<<"${CANDIDATES}"
            return 1
          }

          if [[ -n "${WORKFLOW_RUN_ID}" ]]; then
            run_id="${WORKFLOW_RUN_ID}"
          elif [[ -n "${REQUESTED_RUN_ID}" ]]; then
            run_id="${REQUESTED_RUN_ID}"
          else
            CANDIDATES="$(
              gh run list \
                --workflow=desktop.yml \
                --branch=main \
                --limit=20 \
                --json databaseId,headSha,conclusion,status \
                --jq '.[] | [.databaseId, .headSha, (.conclusion // ""), .status] | @tsv'
            )"
            run_id="$(pick_qualifying_run 1 || true)"
            if [[ -z "${run_id}" ]]; then
              run_id="$(pick_qualifying_run 0 || true)"
            fi
          fi

          if [[ -z "${run_id}" ]]; then
            echo "No desktop.yml run on main includes ${MIN_SHA} and both installer artifacts." >&2
            echo "Wait for desktop.yml to upload FramePilot-windows-nsis and FramePilot-macos-dmg, then re-run." >&2
            exit 1
          fi

          head_sha="$(gh run view "${run_id}" --json headSha --jq .headSha)"
          if ! sha_includes_locked_upgrade_hooks "${head_sha}"; then
            echo "desktop.yml run ${run_id} at ${head_sha} does not include NSIS locked-file hooks ${MIN_SHA}" >&2
            echo "Refuse to republish pre-#198 v2.1.2-desktop packages as v2.1.3-desktop." >&2
            exit 1
          fi
          if ! run_has_installer_artifacts "${run_id}"; then
            echo "desktop.yml run ${run_id} is missing FramePilot-windows-nsis or FramePilot-macos-dmg" >&2
            exit 1
          fi
          echo "Using desktop.yml run ${run_id} at ${head_sha}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download unsigned Windows NSIS
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          name: FramePilot-windows-nsis
          path: dist/windows

      - name: Download unsigned macOS DMG
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          name: FramePilot-macos-dmg
          path: dist/macos

      - name: Verify installer files only
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(dist/windows/*.exe)
          dmgs=(dist/macos/*.dmg)
          if [[ "${#exes[@]}" -ne 1 ]]; then
            echo "Expected exactly one NSIS .exe under dist/windows, found ${#exes[@]}" >&2
            ls -la dist/windows || true
            exit 1
          fi
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG under dist/macos, found ${#dmgs[@]}" >&2
            ls -la dist/macos || true
            exit 1
          fi
          evidence="$(
            find dist \( -name 'FramePilot-desktop-500-gui-*' -o -name 'FramePilot-desktop-quit-job-*' \) -print
          )"
          if [[ -n "${evidence}" ]]; then
            echo "Refusing leftover GUI-evidence artifacts in the release staging tree" >&2
            printf '%s\n' "${evidence}" >&2
            exit 1
          fi
          echo "Windows NSIS: ${exes[0]}"
          echo "macOS DMG: ${dmgs[0]}"

      - name: Publish unsigned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.3-desktop' }}
          target_commitish: ${{ steps.find.outputs.head_sha }}
          name: FramePilot 2.1.3-desktop (unsigned)
          body_path: docs/desktop_unsigned_release_notes.md
          files: |
            dist/windows/*.exe
            dist/macos/*.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
