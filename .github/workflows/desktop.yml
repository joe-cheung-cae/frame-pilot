# D4.04 / S9.11 — Desktop installer matrix (Windows NSIS + macOS DMG).
#
# Trigger design:
#   - workflow_dispatch: manual rebuilds without a merge.
#   - push to main with path filters: after merge, installers appear when
#     desktop/API/packaging/desktop workflow paths change. Docs-only merges
#     skip this job. PRs use verify.yml (rust-free lint/test job, Playwright
#     E2E via npm run test:e2e, 100-photo real-browser via
#     npm run test:e2e:real-browser, independent frozen-sidecar /health, plus
#     independent desktop HTTP smoke via npm run test:desktop:smoke). Never
#     attach photos or project data to artifacts.
#
# Signing-ready: Authenticode (Windows) and Developer ID + notarization
# (macOS) are gated on GitHub secrets. Missing or empty secrets keep the
# unsigned upload path green. If the full secret set is present and
# sign / notarize fails, the job is red (no silent unsigned fallback).
# After PyInstaller, run npm run test:sidecar (GET /health with PYTHONPATH
# unset). Packaged GUI launch is allowed for (a) leftover installer DoD
# smoke (packaging/scripts/macos-dmg-gui-smoke.sh against the just-built
# DMG), (b) packaging/scripts/desktop-500-gui.sh probe + 500 against
# the just-built NSIS/DMG, and (c) packaging/scripts/desktop-quit-job-gui.sh
# packaged macOS quit+job matrix against the just-built DMG. Still do not
# launch GUI from verify.yml. Do not download installer artifacts into a
# second job.

name: desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/api/**"
      - "packaging/**"
      - ".github/workflows/desktop.yml"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        shell: bash
        run: npm run install:all

      - name: Build PyInstaller sidecar
        shell: bash
        run: npm run packaging:sidecar

      - name: Smoke frozen sidecar /health without PYTHONPATH
        shell: bash
        run: npm run test:sidecar

      - name: Stage sidecar into Tauri resources
        shell: bash
        run: bash packaging/scripts/stage-sidecar.sh

      - name: Build Tauri installer
        working-directory: apps/desktop
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -n "${WINDOWS_CERTIFICATE:-}" && -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]]; then
              export PFX_PATH="${RUNNER_TEMP}/windows-codesign.pfx"
              export TAURI_SIGN_CONFIG="${RUNNER_TEMP}/tauri-windows-sign.json"
              python - <<'PY'
          import base64, os, pathlib

          pfx = pathlib.Path(os.environ["PFX_PATH"])
          pfx.write_bytes(base64.b64decode(os.environ["WINDOWS_CERTIFICATE"]))
          ps1 = pathlib.Path(os.environ["RUNNER_TEMP"]) / "import-windows-cert.ps1"
          ps1.write_text(
              "\n".join(
                  [
                      "$ErrorActionPreference = 'Stop'",
                      "$pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText",
                      "$cert = Import-PfxCertificate -FilePath $env:PFX_PATH -CertStoreLocation Cert:\\CurrentUser\\My -Password $pwd",
                      "[Console]::Out.Write($cert.Thumbprint)",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY
              thumbprint="$(
                powershell.exe -NoProfile -NonInteractive -File "${RUNNER_TEMP}/import-windows-cert.ps1" \
                  | tr -d '\r\n'
              )"
              export WINDOWS_CERT_THUMBPRINT="$thumbprint"
              python - <<'PY'
          import json, os, pathlib

          overlay = {
              "bundle": {
                  "windows": {
                      "certificateThumbprint": os.environ["WINDOWS_CERT_THUMBPRINT"],
                      "digestAlgorithm": "sha256",
                      "timestampUrl": "http://timestamp.digicert.com",
                  }
              }
          }
          pathlib.Path(os.environ["TAURI_SIGN_CONFIG"]).write_text(
              json.dumps(overlay), encoding="utf-8"
          )
          PY
              npx tauri build --bundles nsis --config "$TAURI_SIGN_CONFIG"
            else
              npx tauri build --bundles nsis
            fi
          else
            if [[ -n "${APPLE_CERTIFICATE:-}" \
              && -n "${APPLE_CERTIFICATE_PASSWORD:-}" \
              && -n "${APPLE_SIGNING_IDENTITY:-}" \
              && -n "${APPLE_TEAM_ID:-}" \
              && -n "${APPLE_API_ISSUER:-}" \
              && -n "${APPLE_API_KEY:-}" \
              && -n "${APPLE_API_KEY_CONTENT:-}" ]]; then
              export APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
              python - <<'PY'
          import os, pathlib

          pathlib.Path(os.environ["APPLE_API_KEY_PATH"]).write_text(
              os.environ["APPLE_API_KEY_CONTENT"], encoding="utf-8"
          )
          PY
              export APPLE_CERTIFICATE
              export APPLE_CERTIFICATE_PASSWORD
              export APPLE_SIGNING_IDENTITY
              export APPLE_TEAM_ID
              export APPLE_API_ISSUER
              export APPLE_API_KEY
              export APPLE_API_KEY_PATH
              npx tauri build --bundles dmg
            else
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT \
                APPLE_API_KEY_PATH || true
              npx tauri build --bundles dmg
            fi
          fi

      - name: Remove signing material from the runner
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/windows-codesign.pfx" \
            "${RUNNER_TEMP}/import-windows-cert.ps1" \
            "${RUNNER_TEMP}/tauri-windows-sign.json" \
            "${RUNNER_TEMP}/apple-codesign.p12" \
            "${RUNNER_TEMP}"/AuthKey_*.p8 \
            || true

      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Smoke packaged macOS DMG GUI launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -lt 1 ]]; then
            echo "No DMG found under apps/desktop/src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          bash packaging/scripts/macos-dmg-gui-smoke.sh "${dmgs[0]}"

      # Leftover #179 Path B: probe + 500 against the just-built installer.
      # Do not fold this into macos-dmg-gui-smoke.sh (install+run /health only).
      - id: probe-windows
        name: Packaged desktop GUI paint probe
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nsis=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [[ "${#nsis[@]}" -lt 1 ]]; then
            echo "No NSIS installer found under apps/desktop/src-tauri/target/release/bundle/nsis" >&2
            exit 1
          fi
          bash packaging/scripts/desktop-500-gui.sh --probe --installer "${nsis[0]}"

      - id: probe-macos
        name: Packaged desktop GUI paint probe
        if: always() && runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -lt 1 ]]; then
            echo "No DMG found under apps/desktop/src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          bash packaging/scripts/desktop-500-gui.sh --probe --installer "${dmgs[0]}"

      - id: gui500-windows
        name: Packaged desktop ≥500 GUI
        if: always() && runner.os == 'Windows' && steps.probe-windows.outcome == 'success'
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nsis=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [[ "${#nsis[@]}" -lt 1 ]]; then
            echo "No NSIS installer found under apps/desktop/src-tauri/target/release/bundle/nsis" >&2
            exit 1
          fi
          bash packaging/scripts/desktop-500-gui.sh --count 500 --installer "${nsis[0]}"

      - id: gui500-macos
        name: Packaged desktop ≥500 GUI
        if: always() && runner.os == 'macOS' && steps.probe-macos.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -lt 1 ]]; then
            echo "No DMG found under apps/desktop/src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          bash packaging/scripts/desktop-500-gui.sh --count 500 --installer "${dmgs[0]}"

      - name: Upload packaged desktop GUI probe evidence (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-desktop-500-gui-probe-windows
          path: ${{ runner.temp }}/desktop-500-gui/probe-windows/
          if-no-files-found: ${{ steps.probe-windows.outcome == 'success' && 'error' || 'warn' }}

      - name: Upload packaged desktop ≥500 GUI evidence (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-desktop-500-gui-500-windows
          path: ${{ runner.temp }}/desktop-500-gui/500-windows/
          if-no-files-found: ${{ steps.gui500-windows.outcome == 'success' && 'error' || 'warn' }}

      - name: Upload packaged desktop GUI probe evidence (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-desktop-500-gui-probe-macos
          path: ${{ runner.temp }}/desktop-500-gui/probe-macos/
          if-no-files-found: ${{ steps.probe-macos.outcome == 'success' && 'error' || 'warn' }}

      - name: Upload packaged desktop ≥500 GUI evidence (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-desktop-500-gui-500-macos
          path: ${{ runner.temp }}/desktop-500-gui/500-macos/
          if-no-files-found: ${{ steps.gui500-macos.outcome == 'success' && 'error' || 'warn' }}

      # Leftover #181 Path B + production quit. Do not fold into
      # macos-dmg-gui-smoke.sh or desktop-500-gui.sh. A red #179 500 must
      # not skip this leftover.
      - id: quit-job-macos
        name: Packaged macOS quit+job matrix
        if: always() && runner.os == 'macOS'
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -lt 1 ]]; then
            echo "No DMG found under apps/desktop/src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          bash packaging/scripts/desktop-quit-job-gui.sh --count 30 --installer "${dmgs[0]}"

      - name: Upload packaged macOS quit+job matrix evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-desktop-quit-job-macos
          path: ${{ runner.temp }}/desktop-quit-job/
          if-no-files-found: ${{ steps.quit-job-macos.outcome == 'success' && 'error' || 'warn' }}
