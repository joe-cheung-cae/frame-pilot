[package]
name = "framepilot-desktop"
version = "2.0.0-rc2"
description = "FramePilot desktop shell"
authors = ["FramePilot"]
edition = "2021"

[lib]
name = "framepilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
