[project]
name = "framepilot-api"
version = "2.1.0+desktop"
description = "Local-first FramePilot FastAPI backend"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "imagehash>=4.3.2",
  "numpy>=2.0.0",
  "pillow>=12.0.0",
  "pillow-heif>=1.6.0",
  "rawpy>=0.25.0",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[project.scripts]
framepilot-api = "app.sidecar_main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: opt-in heavy proofs (e.g. >4GB Zip64); skip unless FRAMEPILOT_LARGE_ZIP=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
